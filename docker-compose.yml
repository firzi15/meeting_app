
services:
  app:
    build: .
    container_name: meeting_app
    ports:
      - "8080:80"
    environment:
      - DB_HOST=db
      - DB_NAME=meeting_db
      - DB_USER=admin
      - DB_PASS=admin123
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: meeting_db
    environment:
      - POSTGRES_DB=meeting_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"


volumes:
  postgres_data:
